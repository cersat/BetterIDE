name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            files: |
              electron-app/dist/*.AppImage
              electron-app/dist/*.zip
          - os: windows-2022
            name: windows
            files: |
              electron-app/dist/*.exe
              electron-app/dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Linux dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libudev-dev libusb-1.0-0-dev libfuse2
      - name: Windows targets (portable exe and zip)
        if: matrix.name == 'windows'
        shell: bash
        run: node -e "const f='electron-app/package.json',p=require('./'+f);p.build.win.target=['zip','portable'];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - name: Install
        run: yarn --network-timeout 600000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Rebuild native modules for Electron
        run: yarn --cwd electron-app rebuild
      - name: Package
        run: yarn --cwd electron-app package
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@v4
        with:
          name: BetterIDE-${{ matrix.name }}
          path: ${{ matrix.files }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BetterIDE build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.files }}
