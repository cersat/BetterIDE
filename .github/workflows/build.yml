name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'static/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            files: |
              electron-app/dist/*.AppImage
              electron-app/dist/*.zip
              electron-app/dist/*.yml
          - os: windows-2022
            name: windows
            files: |
              electron-app/dist/*.exe
              electron-app/dist/*.zip
              electron-app/dist/*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Linux dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libudev-dev libusb-1.0-0-dev libfuse2
      - name: Windows targets (portable exe, zip and an installer that can update itself)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const file = 'electron-app/package.json';
          const p = JSON.parse(fs.readFileSync(file, 'utf8'));
          p.build.win.target = ['zip', 'portable', 'nsis'];
          p.build.nsis = { ...p.build.nsis, artifactName: 'arduino-ide_${version}_Windows_64bit_setup.${ext}' };
          fs.writeFileSync(file, JSON.stringify(p, null, 2));
          EOF
      - name: Install dependencies
        shell: bash
        timeout-minutes: 20
        run: yarn --ignore-scripts --network-timeout 600000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Electron
        shell: bash
        timeout-minutes: 10
        run: node node_modules/electron/install.js
      - name: Download ripgrep
        shell: bash
        timeout-minutes: 5
        run: node node_modules/@vscode/ripgrep/lib/postinstall.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download CLI, language server, examples, plugins
        shell: bash
        timeout-minutes: 20
        run: |
          mkdir -p arduino-ide-extension/src/node/resources
          yarn --cwd arduino-ide-extension prepare
          # the plugin downloader finishes its work but does not always exit
          timeout 300 yarn --cwd electron-app prepare || true
          ls electron-app/plugins
      - name: Compile the extension
        shell: bash
        timeout-minutes: 20
        run: yarn --cwd arduino-ide-extension build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Rebuild native modules for Electron
        shell: bash
        timeout-minutes: 30
        run: yarn --cwd electron-app rebuild
      - name: Build the Windows certificate addon
        if: matrix.name == 'windows'
        shell: bash
        timeout-minutes: 10
        run: |
          cd node_modules/@vscode/windows-ca-certs
          npx node-gyp rebuild
      - name: Build the ffmpeg addon
        shell: bash
        timeout-minutes: 10
        run: |
          cd node_modules/@theia/ffmpeg
          npx node-gyp rebuild
          mkdir -p build/Debug
          cp build/Release/ffmpeg.node build/Debug/ffmpeg.node
      - name: Build the application
        shell: bash
        timeout-minutes: 40
        run: yarn --cwd electron-app build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package
        shell: bash
        timeout-minutes: 30
        run: yarn --cwd electron-app package
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: BetterIDE-${{ matrix.name }}
          path: ${{ matrix.files }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BetterIDE build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ matrix.files }}
